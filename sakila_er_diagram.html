
<style>
#erd { padding: 8px 0; }
#erd svg { max-width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2852' : '#EEEDFE',
    primaryBorderColor: dark ? '#534AB7' : '#7F77DD',
    primaryTextColor: dark ? '#c2c0b6' : '#3C3489',
    secondaryColor: dark ? '#083c2e' : '#E1F5EE',
    secondaryBorderColor: dark ? '#0F6E56' : '#1D9E75',
    tertiaryColor: dark ? '#3c1b0a' : '#FAECE7',
    tertiaryBorderColor: dark ? '#993C1D' : '#D85A30',
  },
});

const diagram = `erDiagram
  ACTOR {
    int actor_id PK
    string first_name
    string last_name
  }
  FILM {
    int film_id PK
    string title
    string description
    int release_year
    int language_id FK
    int rental_duration
    decimal rental_rate
    int length
    decimal replacement_cost
    string rating
    string special_features
  }
  FILM_ACTOR {
    int actor_id FK
    int film_id FK
  }
  FILM_CATEGORY {
    int film_id FK
    int category_id FK
  }
  CATEGORY {
    int category_id PK
    string name
  }
  LANGUAGE {
    int language_id PK
    string name
  }
  INVENTORY {
    int inventory_id PK
    int film_id FK
    int store_id FK
  }
  RENTAL {
    int rental_id PK
    date rental_date
    int inventory_id FK
    int customer_id FK
    date return_date
    int staff_id FK
  }
  PAYMENT {
    int payment_id PK
    int customer_id FK
    int staff_id FK
    int rental_id FK
    decimal amount
    date payment_date
  }
  CUSTOMER {
    int customer_id PK
    int store_id FK
    string first_name
    string last_name
    int address_id FK
    bool active
  }
  STAFF {
    int staff_id PK
    string first_name
    string last_name
    int address_id FK
    string email
    int store_id FK
    bool active
    string password
  }
  STORE {
    int store_id PK
    int manager_staff_id FK
    int address_id FK
  }
  ADDRESS {
    int address_id PK
    string address
    int city_id FK
    string postal_code
  }
  CITY {
    int city_id PK
    string name
    int country_id FK
  }
  COUNTRY {
    int country_id PK
    string country
  }

  ACTOR ||--o{ FILM_ACTOR : "appears in"
  FILM ||--o{ FILM_ACTOR : "features"
  FILM ||--o{ FILM_CATEGORY : "belongs to"
  CATEGORY ||--o{ FILM_CATEGORY : "categorizes"
  LANGUAGE ||--o{ FILM : "spoken in"
  FILM ||--o{ INVENTORY : "stocked as"
  STORE ||--o{ INVENTORY : "holds"
  INVENTORY ||--o{ RENTAL : "rented via"
  CUSTOMER ||--o{ RENTAL : "makes"
  STAFF ||--o{ RENTAL : "processes"
  CUSTOMER ||--o{ PAYMENT : "pays"
  STAFF ||--o{ PAYMENT : "handles"
  RENTAL ||--o{ PAYMENT : "generates"
  STORE ||--o{ CUSTOMER : "registers"
  STORE ||--o{ STAFF : "employs"
  STORE }o--|| STAFF : "managed by"
  ADDRESS ||--o{ CUSTOMER : "used by"
  ADDRESS ||--o{ STAFF : "used by"
  ADDRESS ||--o{ STORE : "located at"
  CITY ||--o{ ADDRESS : "contains"
  COUNTRY ||--o{ CITY : "contains"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
